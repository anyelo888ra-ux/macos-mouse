name: Compilar macos-mouse a EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pynput pyinstaller pywin32

    - name: Compilar a ejecutable .exe autonomo
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "macos-mouse" main.py

    - name: Subir ejecutable compilado (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: macos-mouse-Windows-x64
        path: dist/macos-mouse.exe
